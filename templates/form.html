<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Information | MediCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: auto;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Poppins', sans-serif;
      color: #333;
      line-height: 1.6;
      background-color: #f9f9f9;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      background-color: #ffffff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: fixed;
      width: 100%;
      z-index: 1000;
      top: 0;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      color: #3498db;
    }
    .nav-links {
      display: flex;
      list-style: none;
    }
    .nav-links li {
      margin-left: 2rem;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 400;
      transition: color 0.3s ease;
    }
    .nav-links a:hover {
      color: #3498db;
    }
    .btn {
      display: inline-block;
      background-color: #3498db;
      color: #fff;
      padding: 0.5rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      font-size: 1rem;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #2980b9;
    }
    .form-section {
      max-width: 800px;
      margin: 100px auto 50px;
      padding: 40px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .form-section h2 {
      font-size: 2.5rem;
      color: #0d47a1;
      margin-bottom: 2rem;
    }
    .form-section label {
      margin-bottom: 10px;
      font-size: 1.2em;
      color: #3498db;
      display: block;
      text-align: left;
    }
    .form-section input[type="text"],
    .form-section input[type="number"],
    .form-section select {
      margin-bottom: 20px;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ddd;
      border-radius: 5px;
      width: 100%;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: flex-start;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      font-size: 0.9em;
      color: #555;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 5px;
    }
    .selected-symptoms {
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 5px;
      border: 1px solid #ddd;
      text-align: left;
    }
    .selected-symptoms ul {
      padding-left: 20px;
    }
    .form-section .auth-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }
    footer {
      background-color: #333;
      color: #fff;
      padding: 2rem 0;
      text-align: center;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="ud" class="logo">MediCare</a>
      </nav>
    </div>
  </header>

  <div class="form-section">
    <h2>Patient Information</h2>
    <form id="patient-form" action="/predict_disease" method="POST">
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required />

      <label for="age">Age:</label>
      <input type="number" id="age" placeholder="Enter your age" required />

      <label for="gender">Gender:</label>
      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label>Symptoms:</label>
      <div class="checkbox-group" id="symptoms">
        <!-- Full list of symptoms -->
        <label><input type="checkbox" name="symptoms" value="itching"> Itching</label>
        <label><input type="checkbox" name="symptoms" value="skin_rash"> Skin Rash</label>
        <label><input type="checkbox" name="symptoms" value="nodal_skin_eruptions"> Nodal Skin Eruptions</label>
        <label><input type="checkbox" name="symptoms" value="continuous_sneezing"> Continuous Sneezing</label>
        <label><input type="checkbox" name="symptoms" value="shivering"> Shivering</label>
        <label><input type="checkbox" name="symptoms" value="acidity"> Acidity</label>
        <label><input type="checkbox" name="symptoms" value="vomiting"> Vomiting</label>
        <label><input type="checkbox" name="symptoms" value="anxiety"> Anxiety</label>
        <label><input type="checkbox" name="symptoms" value="high_fever"> High Fever</label>
        <label><input type="checkbox" name="symptoms" value="yellowish_skin"> Yellowish Skin</label>
        <label><input type="checkbox" name="symptoms" value="back_pain"> Back Pain</label>
        <label><input type="checkbox" name="symptoms" value="diarrhoea"> Diarrhoea</label>
        <label><input type="checkbox" name="symptoms" value="throat_irritation"> Throat Irritation</label>
        <label><input type="checkbox" name="symptoms" value="redness_of_eyes"> Redness Of Eyes</label>
        <label><input type="checkbox" name="symptoms" value="runny_nose"> Runny Nose</label>
        <label><input type="checkbox" name="symptoms" value="dizziness"> Dizziness</label>
        <label><input type="checkbox" name="symptoms" value="unsteadiness"> Unsteadiness</label>
        <label><input type="checkbox" name="symptoms" value="red_spots_over_body"> Red Spots Over Body</label>
        <label><input type="checkbox" name="symptoms" value="skin_peeling"> Skin Peeling</label>
        <label><input type="checkbox" name="symptoms" value="muscle_pain"> Muscle Pain</label>
      </div>

      <div class="selected-symptoms" id="selected-symptoms">
        <h3>Selected Symptoms:</h3>
        <ul></ul>
      </div>

      <div class="auth-buttons">
        <button type="submit" class="btn">Submit</button>
        <a href="/ud" class="btn">Back to Dashboard</a>
      </div>
    </form>
  </div>

  <footer>
    <p>&copy; 2024 MediCare. All rights reserved.</p>
  </footer>

  <script>
    const formElement = document.getElementById('patient-form');
    const selectedSymptomsElement = document.getElementById('selected-symptoms').querySelector('ul');
    const symptomsCheckboxes = document.querySelectorAll('input[name="symptoms"]');
    let form = { symptoms: [] };

    formElement.addEventListener('input', (e) => {
      const { name, value } = e.target;
      if (name === 'symptoms') {
        if (e.target.checked) {
          form.symptoms.push(value);
        } else {
          form.symptoms = form.symptoms.filter(symptom => symptom !== value);
        }
        displaySelectedSymptoms();
      }
    });

    function displaySelectedSymptoms() {
      selectedSymptomsElement.innerHTML = '';
      form.symptoms.forEach(symptom => {
        const li = document.createElement('li');
        li.textContent = symptom.replace(/_/g, ' ');
        selectedSymptomsElement.appendChild(li);
      });
    }
  </script>
</body>
</html>
